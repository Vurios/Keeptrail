[project]
name = "katibay-api"
version = "0.1.0"
description = "Katibay API — receipt verification pipeline, liquidation packets, Purchase Passports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "pillow-heif>=0.18.0",
    "pypdfium2>=4.30.0",
    "opencv-python-headless>=4.10.0.84",
    "imagehash>=4.3.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "asyncpg>=0.29.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "jinja2>=3.1.6",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "black>=25.1",
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katibay_api"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
